services:
  typesense:
    image: typesense/typesense:30.2
    container_name: osp-docs-typesense
    restart: unless-stopped
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - /var/lib/osp-typesense:/data
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY}
      --api-address 0.0.0.0
      --api-port 8108
      --enable-cors

  scraper:
    image: typesense/docsearch-scraper:0.12.2
    profiles:
      - scraper
    depends_on:
      - typesense
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_SCRAPER_API_KEY}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/host-ca-certificates.crt
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/host-ca-certificates.crt:ro
      - ./docsearch.config.json:/docsearch/config.json:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        export CONFIG="$$(cat /docsearch/config.json)"
        echo "CONFIG length: $${#CONFIG}"
        exec pipenv run python -m src.index
